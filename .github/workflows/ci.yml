name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml so a tag is only released after the same checks pass.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: strix
          POSTGRES_PASSWORD: strix
          POSTGRES_DB: strix_panel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strix -d strix_panel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://strix:strix@localhost:5432/strix_panel_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  docker:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-at-runtime
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
