# Local development infra only. Apps run on the host with `bun run dev`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: strix
      POSTGRES_PASSWORD: strix
      POSTGRES_DB: strix_panel
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strix -d strix_panel']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
